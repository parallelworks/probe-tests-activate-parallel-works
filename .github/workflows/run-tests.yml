name: Run PROBE tests

# Runs workflows/probe/yamls/general_run_tests.yaml of parallelworks/workflows on the
# platform with the test definitions of this branch: all of them, or the listed test
# files. Results go to the bucket as each test finishes; open the dashboard and press
# Refresh to see them. Manual only; a `schedule` trigger can be added here to run it
# periodically.
on:
  workflow_dispatch:
    inputs:
      resource:
        description: 'Resource the tests are launched from (e.g. pw://alvaro/user-workspace)'
        required: true
        default: 'pw://alvaro/gcpsmall'
        type: string
      selection:
        description: 'all, or test files relative to tests/ separated by spaces'
        required: false
        default: 'all'
        type: string
      bucket:
        description: 'Results bucket URI'
        required: true
        default: 'pw://alvaro/gcpbucket'
        type: string
      bucket_path:
        description: 'Path inside the bucket'
        required: false
        default: 'probe/results'
        type: string
      workflows_ref:
        description: 'Branch, tag or commit of parallelworks/workflows to take the PROBE workflow from'
        required: false
        default: 'canary'
        type: string
      wait:
        description: 'Wait for the tests and fail this job when one fails'
        required: false
        default: true
        type: boolean

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      PW_PLATFORM_HOST: activate.parallel.works
      # The CLI takes its credential from the environment (pw auth --help)
      PW_API_KEY: ${{ secrets.ACTIVATE_PARALLEL_WORKS }}
      RESOURCE: ${{ inputs.resource }}
      BUCKET: ${{ inputs.bucket }}
      BUCKET_PATH: ${{ inputs.bucket_path || 'probe/results' }}
      SELECTION: ${{ inputs.selection || 'all' }}
      WORKFLOWS_REF: ${{ inputs.workflows_ref || 'canary' }}
      WAIT: ${{ inputs.wait }}
      TESTS_REPO: ${{ github.server_url }}/${{ github.repository }}.git
      TESTS_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Check out the PROBE workflow
        uses: actions/checkout@v4
        with:
          repository: parallelworks/workflows
          ref: ${{ inputs.workflows_ref || 'canary' }}
          sparse-checkout: workflows/probe/yamls

      - name: Install pw CLI
        run: |
          mkdir -p ~/bin
          wget -q "https://${PW_PLATFORM_HOST}/cli/pw-linux-amd64" -O ~/bin/pw
          chmod +x ~/bin/pw
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Create inputs.json
        run: |
          python3 - <<'EOF'
          import json, os
          env = os.environ
          inputs = {
              "cluster": {"resource": env["RESOURCE"]},
              "selection": env["SELECTION"],
              "tests": {"repo": env["TESTS_REPO"], "branch": env["TESTS_BRANCH"], "directory": "tests"},
              "results": {"bucket": env["BUCKET"], "path": env["BUCKET_PATH"]},
          }
          json.dump(inputs, open("inputs.json", "w"), indent=2)
          print(json.dumps(inputs, indent=2))
          EOF

      - name: Run the tests
        run: |
          pw workflows run --trust -o json \
            --name "PROBE tests (${TESTS_BRANCH}, workflows@${WORKFLOWS_REF})" \
            -i inputs.json "$GITHUB_WORKSPACE/workflows/probe/yamls/general_run_tests.yaml" | tee run.json
          SLUG=$(python3 -c "import json; raw=open('run.json').read(); print(json.JSONDecoder().raw_decode(raw[raw.index('{'):])[0]['run']['slug'])")
          echo "::notice::Platform run ${SLUG}: pw workflows runs view ${SLUG}"
          if [ "${WAIT}" != "true" ]; then
            exit 0
          fi
          while :; do
            # The CLI may print an upgrade notice before the JSON document
            STATUS=$(pw workflows runs view -o json "${SLUG}" 2>/dev/null \
              | python3 -c "import json,sys; raw=sys.stdin.read(); print(json.JSONDecoder().raw_decode(raw[raw.index('{'):])[0].get('status', '') if '{' in raw else '')" 2>/dev/null)
            case "${STATUS}" in
              completed)
                echo "All tests passed."
                pw workflows runs logs --job run --step "Run tests" --tail 40 "${SLUG}" || true
                exit 0 ;;
              error|failed|canceled)
                pw workflows runs logs --job run --step "Run tests" --tail 60 "${SLUG}" || true
                echo "::error::Run ${SLUG} ended with status ${STATUS}: a test failed or the run broke. See the dashboard or pw workflows runs errors ${SLUG}"
                exit 1 ;;
            esac
            sleep 60
          done
