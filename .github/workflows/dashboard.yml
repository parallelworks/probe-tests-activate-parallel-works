name: Start PROBE dashboard

# Deploys workflows/probe/yamls/general.yaml of parallelworks/workflows on the
# platform: the read-only and admin dashboards for the results in the bucket, with
# the test definitions of this branch. The platform run completes once the endpoints
# answer; the dashboards live until their endpoints are deleted. Nothing runs tests
# here.
on:
  workflow_dispatch:
    inputs:
      resource:
        description: 'Resource the dashboards run on (e.g. pw://alvaro/user-workspace)'
        required: true
        default: 'pw://alvaro/gcpsmall'
        type: string
      bucket:
        description: 'Results bucket URI'
        required: true
        default: 'pw://alvaro/gcpbucket'
        type: string
      bucket_path:
        description: 'Path inside the bucket'
        required: false
        default: 'probe/results'
        type: string
      workflows_ref:
        description: 'Branch, tag or commit of parallelworks/workflows to take the PROBE workflow from'
        required: false
        default: 'canary'
        type: string

jobs:
  start:
    runs-on: ubuntu-latest
    env:
      PW_PLATFORM_HOST: activate.parallel.works
      # The CLI takes its credential from the environment (pw auth --help); the same
      # key goes to the dashboards, which outlive the platform run
      PW_API_KEY: ${{ secrets.ACTIVATE_PARALLEL_WORKS }}
      RESOURCE: ${{ inputs.resource }}
      BUCKET: ${{ inputs.bucket }}
      BUCKET_PATH: ${{ inputs.bucket_path || 'probe/results' }}
      WORKFLOWS_REF: ${{ inputs.workflows_ref || 'canary' }}
      TESTS_REPO: ${{ github.server_url }}/${{ github.repository }}.git
      TESTS_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Check out the PROBE workflow
        uses: actions/checkout@v4
        with:
          repository: parallelworks/workflows
          ref: ${{ inputs.workflows_ref || 'canary' }}
          sparse-checkout: workflows/probe/yamls

      - name: Install pw CLI
        run: |
          mkdir -p ~/bin
          wget -q "https://${PW_PLATFORM_HOST}/cli/pw-linux-amd64" -O ~/bin/pw
          chmod +x ~/bin/pw
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Create inputs.json
        run: |
          python3 - <<'EOF'
          import json, os
          env = os.environ
          inputs = {
              "cluster": {"resource": env["RESOURCE"]},
              "api_key": env["PW_API_KEY"],
              "tests": {"repo": env["TESTS_REPO"], "branch": env["TESTS_BRANCH"], "directory": "tests"},
              "results": {"bucket": env["BUCKET"], "path": env["BUCKET_PATH"]},
          }
          json.dump(inputs, open("inputs.json", "w"), indent=2)
          print(json.dumps(dict(inputs, api_key="<redacted>"), indent=2))
          EOF

      - name: Start the dashboards
        run: |
          pw workflows run --trust -o json \
            --name "PROBE dashboard (${TESTS_BRANCH}, workflows@${WORKFLOWS_REF})" \
            -i inputs.json "$GITHUB_WORKSPACE/workflows/probe/yamls/general.yaml" | tee run.json
          rm -f inputs.json
          SLUG=$(python3 -c "import json; raw=open('run.json').read(); print(json.JSONDecoder().raw_decode(raw[raw.index('{'):])[0]['run']['slug'])")
          echo "::notice::Dashboards: endpoints probe-${SLUG} and probe-admin-${SLUG} (pw endpoints list). Take them down with: pw endpoints delete probe-${SLUG}; pw endpoints delete probe-admin-${SLUG}"
